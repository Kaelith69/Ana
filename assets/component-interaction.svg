<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Ana component interaction diagram">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .actor { fill: #ecfeff; stroke: #155e75; stroke-width: 2; rx: 12; }
      .service { fill: #eff6ff; stroke: #1e3a8a; stroke-width: 2; rx: 12; }
      .store { fill: #fef3c7; stroke: #92400e; stroke-width: 2; rx: 12; }
      .text { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#m); }
      .label { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff" />
  <text x="40" y="52" class="title">Component Interaction Map</text>

  <rect x="70" y="110" width="210" height="90" class="actor" />
  <text x="100" y="150" class="text">Discord User</text>

  <rect x="360" y="95" width="260" height="120" class="service" />
  <text x="390" y="145" class="text">main.py Bot Core</text>

  <rect x="700" y="90" width="260" height="130" class="service" />
  <text x="730" y="140" class="text">nlp.py Engine</text>

  <rect x="1000" y="110" width="150" height="90" class="service" />
  <text x="1020" y="150" class="text">Groq API</text>

  <rect x="1000" y="250" width="150" height="90" class="service" />
  <text x="1010" y="290" class="text">Gemini API</text>

  <rect x="360" y="290" width="260" height="110" class="service" />
  <text x="390" y="335" class="text">jokes.py Service</text>

  <rect x="700" y="290" width="260" height="110" class="service" />
  <text x="730" y="335" class="text">profiles.py Store</text>

  <rect x="360" y="470" width="260" height="100" class="service" />
  <text x="390" y="515" class="text">keepalive.py</text>

  <rect x="700" y="470" width="260" height="100" class="store" />
  <text x="730" y="515" class="text">data/profiles JSON</text>

  <rect x="70" y="470" width="210" height="100" class="service" />
  <text x="95" y="515" class="text">icanhazdadjoke API</text>

  <path class="line" d="M280 150 L360 150" />
  <text x="295" y="138" class="label">messages</text>

  <path class="line" d="M620 150 L700 150" />
  <text x="635" y="138" class="label">generation request</text>

  <path class="line" d="M960 150 L1000 150" />
  <path class="line" d="M960 280 L1000 280" />
  <path class="line" d="M700 190 L620 190" />
  <text x="640" y="205" class="label">reply text</text>

  <path class="line" d="M620 330 L700 330" />
  <text x="635" y="318" class="label">profile context/update</text>

  <path class="line" d="M830 400 L830 470" />
  <text x="840" y="435" class="label">persist</text>

  <path class="line" d="M620 330 L360 330" />
  <text x="460" y="318" class="label">no-trigger branch</text>

  <path class="line" d="M280 510 L360 330" />
  <text x="250" y="415" class="label">joke fetch</text>

  <path class="line" d="M620 520 L700 520" />
  <path class="line" d="M620 520 L620 180" />
  <text x="540" y="350" class="label">health + responses</text>
</svg>
